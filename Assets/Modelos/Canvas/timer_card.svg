<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <clipPath id="card-clip">
      <rect width="200" height="120" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Fondo azul oscuro -->
    <rect width="200" height="120" fill="#0d2a5a"/>
  </g>

  <!-- Borde blanco exterior -->
  <rect x="1.5" y="1.5" width="197" height="117" rx="15" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Borde interior cian sutil -->
  <rect x="5" y="5" width="190" height="110" rx="12" fill="none" stroke="#60b4ff" stroke-width="1" opacity="0.4"/>
</svg>
