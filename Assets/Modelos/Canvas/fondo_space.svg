<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <clipPath id="clip"><rect width="520" height="520" rx="20"/></clipPath>

    <!-- Gradiente fondo principal -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#0d1b4b"/>
      <stop offset="60%"  stop-color="#050d2a"/>
      <stop offset="100%" stop-color="#000510"/>
    </radialGradient>

    <!-- Glow central púrpura -->
    <radialGradient id="glow-center" cx="50%" cy="42%" r="38%">
      <stop offset="0%"   stop-color="#6a00ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6a00ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow verde abajo -->
    <radialGradient id="glow-bottom" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow cian arriba derecha -->
    <radialGradient id="glow-tr" cx="85%" cy="15%" r="40%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebulosa izquierda -->
    <radialGradient id="nebula-l" cx="0%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff006688" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff0066"   stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente grid suelo -->
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow neón para borde -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Glow suave para objetos -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Estrellas pattern -->
    <pattern id="stars-sm" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="8"  cy="12" r="0.8" fill="#fff" opacity="0.7"/>
      <circle cx="25" cy="4"  r="0.6" fill="#fff" opacity="0.5"/>
      <circle cx="42" cy="22" r="1.0" fill="#fff" opacity="0.8"/>
      <circle cx="14" cy="38" r="0.7" fill="#7efff5" opacity="0.6"/>
      <circle cx="36" cy="44" r="0.9" fill="#fff" opacity="0.6"/>
      <circle cx="3"  cy="47" r="0.5" fill="#b47eff" opacity="0.6"/>
      <circle cx="48" cy="8"  r="0.6" fill="#fff" opacity="0.5"/>
    </pattern>

    <pattern id="stars-lg" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="30"  cy="20"  r="1.5" fill="#fff" opacity="0.9"/>
      <circle cx="90"  cy="55"  r="1.2" fill="#7efff5" opacity="0.8"/>
      <circle cx="15"  cy="90"  r="1.8" fill="#fff" opacity="0.7"/>
      <circle cx="75"  cy="100" r="1.0" fill="#b47eff" opacity="0.8"/>
      <circle cx="105" cy="30"  r="1.3" fill="#fff" opacity="0.6"/>
    </pattern>
  </defs>

  <g clip-path="url(#clip)">

    <!-- === FONDO === -->
    <rect width="520" height="520" fill="url(#bg-grad)"/>
    <rect width="520" height="520" fill="url(#stars-sm)"/>
    <rect width="520" height="520" fill="url(#stars-lg)"/>

    <!-- Glows ambientales -->
    <rect width="520" height="520" fill="url(#glow-center)"/>
    <rect width="520" height="520" fill="url(#glow-bottom)"/>
    <rect width="520" height="520" fill="url(#glow-tr)"/>
    <rect width="520" height="520" fill="url(#nebula-l)"/>

    <!-- === PLANETA GRANDE CENTRAL === -->
    <!-- Sombra difusa -->
    <circle cx="260" cy="230" r="105" fill="#000" opacity="0.4" filter="url(#soft-glow)"/>
    <!-- Cuerpo planeta -->
    <circle cx="260" cy="230" r="98" fill="#0a1540"/>
    <!-- Textura superficie -->
    <circle cx="260" cy="230" r="98" fill="none" stroke="#1a3080" stroke-width="1" opacity="0.6"/>
    <ellipse cx="240" cy="195" rx="55" ry="28" fill="#0f2060" opacity="0.7" transform="rotate(-20,240,195)"/>
    <ellipse cx="285" cy="255" rx="40" ry="18" fill="#0f2060" opacity="0.5" transform="rotate(15,285,255)"/>
    <ellipse cx="220" cy="255" rx="25" ry="12" fill="#142575" opacity="0.4" transform="rotate(-10,220,255)"/>
    <!-- Brillo atmosférico -->
    <circle cx="260" cy="230" r="98" fill="none" stroke="#3060ff" stroke-width="6" opacity="0.15"/>
    <circle cx="260" cy="230" r="104" fill="none" stroke="#4080ff" stroke-width="3" opacity="0.10"/>
    <!-- Highlight -->
    <ellipse cx="225" cy="190" rx="28" ry="18" fill="#ffffff" opacity="0.04" transform="rotate(-30,225,190)"/>

    <!-- === ANILLO PLANETA === -->
    <ellipse cx="260" cy="230" rx="148" ry="28" fill="none" stroke="#6a00ff" stroke-width="2.5" opacity="0.55" filter="url(#soft-glow)"/>
    <ellipse cx="260" cy="230" rx="148" ry="28" fill="none" stroke="#9040ff" stroke-width="1" opacity="0.3"/>
    <!-- Parte trasera anillo (detrás del planeta) -->
    <ellipse cx="260" cy="230" rx="148" ry="28" fill="none" stroke="#6a00ff" stroke-width="1.5" opacity="0.2" stroke-dasharray="240 220"/>

    <!-- Líneas del anillo -->
    <ellipse cx="260" cy="230" rx="135" ry="24" fill="none" stroke="#8030ee" stroke-width="1" opacity="0.25"/>
    <ellipse cx="260" cy="230" rx="160" ry="32" fill="none" stroke="#5010cc" stroke-width="1" opacity="0.20"/>

    <!-- === LUNA PEQUEÑA === -->
    <circle cx="400" cy="105" r="28" fill="#0d1f3a"/>
    <circle cx="400" cy="105" r="28" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="392" cy="98"  r="5"  fill="#112050" opacity="0.8"/>
    <circle cx="407" cy="112" r="3"  fill="#112050" opacity="0.6"/>
    <!-- Brillo luna -->
    <ellipse cx="392" cy="95" rx="8" ry="5" fill="#fff" opacity="0.04" transform="rotate(-20,392,95)"/>

    <!-- === ASTEROIDE PEQUEÑO IZQUIERDA === -->
    <ellipse cx="72" cy="370" rx="22" ry="14" fill="#0a1530" transform="rotate(-25,72,370)"/>
    <ellipse cx="72" cy="370" rx="22" ry="14" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4" transform="rotate(-25,72,370)"/>
    <circle cx="66" cy="365" r="3" fill="#0d1f3a" opacity="0.8" transform="rotate(-25,72,370)"/>

    <!-- === GRID SUELO === -->
    <!-- Líneas horizontales perspectiva -->
    <g opacity="1">
      <line x1="0" y1="400" x2="520" y2="400" stroke="#00ff88" stroke-width="0.6" opacity="0.20"/>
      <line x1="0" y1="420" x2="520" y2="420" stroke="#00ff88" stroke-width="0.6" opacity="0.17"/>
      <line x1="0" y1="440" x2="520" y2="440" stroke="#00ff88" stroke-width="0.6" opacity="0.14"/>
      <line x1="0" y1="460" x2="520" y2="460" stroke="#00ff88" stroke-width="0.5" opacity="0.11"/>
      <line x1="0" y1="480" x2="520" y2="480" stroke="#00ff88" stroke-width="0.5" opacity="0.08"/>
      <line x1="0" y1="500" x2="520" y2="500" stroke="#00ff88" stroke-width="0.4" opacity="0.06"/>
    </g>
    <!-- Líneas verticales perspectiva (convergentes hacia centro) -->
    <g opacity="1">
      <line x1="260" y1="390" x2="0"   y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="65"  y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="130" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="195" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="260" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="325" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="390" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="455" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
      <line x1="260" y1="390" x2="520" y2="520" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
    </g>
    <!-- Línea horizonte -->
    <line x1="0" y1="390" x2="520" y2="390" stroke="#00ff88" stroke-width="1.5" opacity="0.35" filter="url(#soft-glow)"/>

    <!-- === DETALLES DECORATIVOS === -->
    <!-- Líneas de velocidad / warp -->
    <line x1="0"   y1="155" x2="80"  y2="158" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="0"   y1="168" x2="55"  y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.10"/>
    <line x1="440" y1="310" x2="520" y2="308" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="460" y1="322" x2="520" y2="320" stroke="#ffffff" stroke-width="0.5" opacity="0.10"/>

    <!-- Cruz de mira decorativa -->
    <g transform="translate(440,420)" opacity="0.35">
      <line x1="-14" y1="0" x2="-6" y2="0" stroke="#00ff88" stroke-width="1.2"/>
      <line x1="6"  y1="0" x2="14" y2="0" stroke="#00ff88" stroke-width="1.2"/>
      <line x1="0" y1="-14" x2="0" y2="-6" stroke="#00ff88" stroke-width="1.2"/>
      <line x1="0" y1="6"  x2="0" y2="14" stroke="#00ff88" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#00ff88" stroke-width="1"/>
    </g>
    <g transform="translate(78,440)" opacity="0.3">
      <line x1="-10" y1="0" x2="-5" y2="0" stroke="#00d4ff" stroke-width="1"/>
      <line x1="5"  y1="0" x2="10" y2="0" stroke="#00d4ff" stroke-width="1"/>
      <line x1="0" y1="-10" x2="0" y2="-5" stroke="#00d4ff" stroke-width="1"/>
      <line x1="0" y1="5"  x2="0" y2="10" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
    </g>

    <!-- Puntos laterales -->
    <circle cx="12" cy="160" r="6" fill="#00ff88" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="12" cy="250" r="6" fill="#b47eff" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="12" cy="340" r="6" fill="#00d4ff" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="12" cy="430" r="6" fill="#00ff88" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="508" cy="160" r="6" fill="#00ff88" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="508" cy="250" r="6" fill="#b47eff" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="508" cy="340" r="6" fill="#00d4ff" opacity="0.75" filter="url(#soft-glow)"/>
    <circle cx="508" cy="430" r="6" fill="#00ff88" opacity="0.75" filter="url(#soft-glow)"/>

    <!-- === FRANJA SUPERIOR === -->
    <rect x="0" y="0" width="520" height="60" fill="#000820" opacity="0.80"/>
    <line x1="0" y1="60" x2="520" y2="60" stroke="#00ff88" stroke-width="2" opacity="0.6" filter="url(#soft-glow)"/>
    <!-- Decoración lateral título -->
    <line x1="30"  y1="30" x2="80"  y2="30" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="440" y1="30" x2="490" y2="30" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="28"  cy="30" r="3" fill="#00ff88" opacity="0.6"/>
    <circle cx="492" cy="30" r="3" fill="#00ff88" opacity="0.6"/>
    <text x="260" y="38" font-family="monospace" font-size="22" font-weight="bold"
          fill="#00ff88" text-anchor="middle" letter-spacing="8" opacity="0.95">ALIEN ATTACK</text>

  </g>

  <!-- Borde neón exterior -->
  <rect x="1.5" y="1.5" width="517" height="517" rx="19" fill="none" stroke="#00ff88" stroke-width="3.5" filter="url(#neon)"/>
  <rect x="7"   y="7"   width="506" height="506" rx="15" fill="none" stroke="#00ff88" stroke-width="1"   opacity="0.30"/>

  <!-- Esquinas decorativas -->
  <!-- TL -->
  <circle cx="20" cy="20" r="8" fill="#00ff88" filter="url(#soft-glow)"/>
  <line x1="32" y1="20" x2="50" y2="20" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="32" x2="20" y2="50" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <!-- TR -->
  <circle cx="500" cy="20" r="8" fill="#00ff88" filter="url(#soft-glow)"/>
  <line x1="488" y1="20" x2="470" y2="20" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="500" y1="32" x2="500" y2="50" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <!-- BL -->
  <circle cx="20" cy="500" r="8" fill="#00ff88" filter="url(#soft-glow)"/>
  <line x1="32" y1="500" x2="50" y2="500" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="488" x2="20" y2="470" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <!-- BR -->
  <circle cx="500" cy="500" r="8" fill="#00ff88" filter="url(#soft-glow)"/>
  <line x1="488" y1="500" x2="470" y2="500" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="500" y1="488" x2="500" y2="470" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
</svg>
