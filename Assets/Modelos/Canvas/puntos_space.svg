<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <clipPath id="clip"><rect width="200" height="120" rx="14"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0a1f3a"/>
      <stop offset="100%" stop-color="#000810"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5"  cy="8"  r="0.6" fill="#fff" opacity="0.5"/>
      <circle cx="18" cy="3"  r="0.5" fill="#fff" opacity="0.4"/>
      <circle cx="26" cy="20" r="0.7" fill="#7efff5" opacity="0.4"/>
      <circle cx="10" cy="25" r="0.5" fill="#fff" opacity="0.3"/>
    </pattern>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="200" height="120" fill="url(#bg)"/>
    <rect width="200" height="120" fill="url(#stars)"/>
    <rect width="200" height="120" fill="url(#glow-c)"/>

    <!-- Grid perspectiva sutil -->
    <line x1="100" y1="70" x2="0"   y2="120" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    <line x1="100" y1="70" x2="50"  y2="120" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    <line x1="100" y1="70" x2="100" y2="120" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    <line x1="100" y1="70" x2="150" y2="120" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    <line x1="100" y1="70" x2="200" y2="120" stroke="#00ff88" stroke-width="0.4" opacity="0.12"/>
    <line x1="0"   y1="90" x2="200" y2="90"  stroke="#00ff88" stroke-width="0.4" opacity="0.10"/>
    <line x1="0"   y1="105" x2="200" y2="105" stroke="#00ff88" stroke-width="0.3" opacity="0.07"/>

    <!-- Esquinas decorativas -->
    <line x1="14" y1="8"   x2="30"  y2="8"   stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="8"   x2="14"  y2="24"  stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="14" cy="8" r="2.5" fill="#00ff88" opacity="0.7"/>
    <line x1="186" y1="8"  x2="170" y2="8"   stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="186" y1="8"  x2="186" y2="24"  stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="186" cy="8" r="2.5" fill="#00ff88" opacity="0.7"/>
    <line x1="14"  y1="112" x2="30"  y2="112" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="14"  y1="112" x2="14"  y2="96"  stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="14" cy="112" r="2.5" fill="#00ff88" opacity="0.7"/>
    <line x1="186" y1="112" x2="170" y2="112" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="186" y1="112" x2="186" y2="96"  stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="186" cy="112" r="2.5" fill="#00ff88" opacity="0.7"/>

    <!-- Línea separadora -->
    <line x1="20" y1="36" x2="180" y2="36" stroke="#00ff88" stroke-width="0.8" opacity="0.25"/>

    <!-- Icono estrella -->
    <polygon points="28,13 30,19 36,19 31,23 33,29 28,25 23,29 25,23 20,19 26,19"
             fill="#00ff88" opacity="0.75"/>

    <!-- Label PUNTOS -->
    <text x="100" y="24" font-family="monospace" font-size="11" font-weight="bold"
          fill="#00ff88" text-anchor="middle" letter-spacing="4" opacity="0.80">PUNTOS</text>

  </g>

  <!-- Borde neón -->
  <rect x="1" y="1" width="198" height="118" rx="13" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#neon)"/>
  <rect x="5" y="5" width="190" height="110" rx="10" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.25"/>
</svg>
